[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-mcp-server"
version = "0.1.0"
description = "Local stdio MCP tools for the TFT Set 4 simulator"
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<2", "tft-simulator==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tft-mcp = "tft_mcp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
